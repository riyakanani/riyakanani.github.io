<!-- Same look as the old sidebar (dark grey, icon above each label), laid out across the top -->
<nav class="topnav w3-text-sand" aria-label="Main">
  <a href="./index.html" data-nav="home" class="w3-hover-black"><i class="fa fa-home"></i><span>HOME</span></a>
  <a href="./cv.html" data-nav="cv" class="w3-hover-black"><i class="fa fa-user"></i><span>CV</span></a>
  <a href="./selected_works.html" data-nav="works" class="w3-hover-black"><i class="fa fa-eye"></i><span>ALL WORKS</span></a>
  <a href="./about.html" data-nav="about" class="w3-hover-black"><i class="fa fa-info-circle"></i><span>ABOUT ME</span></a>
</nav>

<style>
  /* Top navigation bar: stays at the top of the screen while scrolling */
  #nav_bar { position: sticky; top: 0; z-index: 100; }
  .topnav { display: flex; justify-content: center; background: #222; font-family: "Montserrat", sans-serif; }
  .topnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
              width: 120px; padding: 12px 0 10px; color: #fdf5e6; text-decoration: none; font-size: 12px;
              text-align: center; box-shadow: inset 0 -4px 0 transparent; transition: background .2s; }
  .topnav a i { font-size: 26px; line-height: 1; }
  .topnav a:hover { background: #000; color: #fff; }
  /* Current page: black tile with a cream bar along the bottom (was along the side) */
  .topnav a.nav-active { background: #000; color: #fff; font-weight: bold; box-shadow: inset 0 -4px 0 #fdf5e6; }
  @media (min-width: 1800px) { .topnav a { width: 140px; font-size: 13px; } .topnav a i { font-size: 30px; } }
  /* Phones and tablets: the old slim top bar, text only, four equal buttons */
  @media (max-width: 992px) {
    .topnav { background: #000; }
    .topnav a { flex: 1; width: auto; padding: 14px 4px; font-size: 12px; box-shadow: none; }
    .topnav a i { display: none; }
    .topnav a.nav-active { background: #fdf5e6; color: #000; box-shadow: none; }
  }
</style>
<script>
  (function () {
    var p = decodeURIComponent(location.pathname).toLowerCase();
    var key = "home";
    if (p.indexOf("/selected works pages/") !== -1 || /selected_works\.html$/.test(p)) key = "works";
    else if (/\/cv\.html$/.test(p)) key = "cv";
    else if (/\/(about|contact)\.html$/.test(p)) key = "about";
    var links = document.querySelectorAll('a[data-nav="' + key + '"]');
    for (var i = 0; i < links.length; i++) {
      links[i].classList.add("nav-active");
      links[i].setAttribute("aria-current", "page");
    }
  })();
</script>
