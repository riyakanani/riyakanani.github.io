<script>
  (function () {
    // Work out the site root from the shared stylesheet link, so this works at any folder depth
    var link = document.querySelector('link[href*="site.css"]');
    var base = link ? link.href.replace(/site\.css.*$/, "") : "";
    window.__footerBase = base;
    // on black pages, flip the footer to cream so the skyline doesn't vanish into the background
    var bg = getComputedStyle(document.body).backgroundColor.match(/\d+/g) || [255, 255, 255];
    if ((+bg[0] * 0.299 + +bg[1] * 0.587 + +bg[2] * 0.114) < 80) {
      var ft = document.querySelector(".site-footer"); if (ft) ft.classList.add("on-dark");
    }
    function go() {
      var s = document.createElement("script");
      s.src = base + "footer/footer-gl.js?v=14";
      document.body.appendChild(s);
    }
    // share one copy of three.js with anything else on the page (e.g. the homepage title)
    if (window.THREE) { go(); return; }
    if (!window.__threeWaiters) {
      window.__threeWaiters = [];
      var t = document.createElement("script");
      t.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
      t.onload = function () { window.__threeWaiters.forEach(function (f) { f(); }); };
      document.head.appendChild(t);
    }
    window.__threeWaiters.push(go);
  })();
</script>
