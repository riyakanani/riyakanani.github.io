<!doctype html>
<html>
<head>
    <title>Graphics</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../W3.css">
    <link rel="stylesheet" href="../site.css?v=14">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600,700,800">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
    body, h1,h2,h3,h4,h5,h6 {font-family: "Montserrat", sans-serif}
    .gfx { max-width: 1100px; margin: 0 auto; padding: 64px 24px 24px; color: #fdf5e6; }
    @media (min-width: 1201px) { .gfx { padding-left: 144px; } }

    .back { display: inline-block; margin-bottom: 14px; color: rgba(253,245,230,.7); text-decoration: none; font-size: .85em; font-weight: 600; }
    .back:hover { color: #fdf5e6; }
    .gfx-head h1 { margin: 0; font-weight: 700; }
    .gfx-head p { margin: 8px 0 0; color: rgba(253,245,230,.75); font-size: 1.05em; }
    .gfx hr { width: 200px; margin: 14px 0 6px; border-color: rgba(253,245,230,.5); }

    .gfx-section { padding-top: 34px; }
    .gfx-section h2 { margin: 0; font-weight: 600; }
    .gfx-section h2 small { margin-left: 10px; font-size: .5em; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(253,245,230,.55); }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; margin-top: 18px; }
    .col { display: flex; flex-direction: column; gap: 22px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

    /* Rounded cards, like the homepage tiles */
    .card { margin: 0; background: #616161; border-radius: 30px; overflow: hidden; transition: transform .3s ease, box-shadow .3s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 0 40px rgba(253,245,230,.18); }
    .card .media { display: block; width: 100%; cursor: zoom-in; overflow: hidden; background: #000; }
    .card img, .card video { display: block; width: 100%; height: auto; border-radius: 0; margin: 0; transition: transform .35s ease; }
    .card:hover .media img, .card:hover .media video { transform: scale(1.03); }
    .card figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 22px 16px; }
    .card figcaption b { font-size: 1em; font-weight: 600; }
    .tag { font-size: .72em; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; opacity: .7; white-space: nowrap; }

    /* Before / after slider */
    .ba { position: relative; overflow: hidden; cursor: ew-resize; user-select: none; touch-action: pan-y; }
    .ba img { display: block; width: 100%; height: auto; pointer-events: none; }
    .ba .before { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0); }
    .ba .before img { height: 100%; object-fit: cover; }
    .ba .handle { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 3px; background: #fdf5e6; transform: translateX(-50%); }
    .ba .handle::after { content: "\2194"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 44px; height: 44px; border-radius: 50%; background: #fdf5e6; color: #111; box-shadow: 0 4px 14px rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .ba .lbl { position: absolute; top: 14px; font-size: .72em; font-weight: 700; letter-spacing: 1px; padding: 6px 12px;
      border-radius: 999px; background: rgba(0,0,0,.6); color: #fdf5e6; }
    .ba .lbl.l { left: 14px; } .ba .lbl.r { right: 14px; }

    /* Lightbox */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.9); align-items: center; justify-content: center; padding: 24px; }
    .lightbox.open { display: flex; }
    .lightbox img, .lightbox video { max-width: 100%; max-height: 88vh; border-radius: 16px; }
    .lightbox button { position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; border: 0;
      background: #fdf5e6; color: #111; font-size: 24px; line-height: 44px; cursor: pointer; }
    </style>
</head>

<body class="w3-black w3-text-sand">
  <!-- Navigation -->
  <div id="nav_bar"> </div>

  <main class="gfx">
    <a class="back" href="../selected_works.html">&larr; Selected Works</a>
    <header class="gfx-head">
      <h1>Graphics</h1>
      <p>Illustration and photo editing in Adobe Illustrator and Photoshop.</p>
    </header>

    <!-- Illustrator -->
    <section class="gfx-section">
      <h2>Illustrator <small>Vector illustration</small></h2>
      <hr class="w3-opacity">
      <div class="grid">
        <figure class="card">
          <span class="media"><img src="./Illustrator Media/woman_poster.jpg" alt="Layered rainbow figure slumped over a black-and-white bar" loading="lazy"></span>
          <figcaption><b>Melting Rainbow: Bar Scene</b><span class="tag">Illustrator</span></figcaption>
        </figure>
        <figure class="card">
          <span class="media"><img src="./Illustrator Media/rainbow_woman.jpg" alt="Layered rainbow figure standing and fallen forward" loading="lazy"></span>
          <figcaption><b>Melting Rainbow: Figure Studies</b><span class="tag">Illustrator</span></figcaption>
        </figure>
      </div>
    </section>

    <!-- Photoshop -->
    <section class="gfx-section">
      <h2>Photoshop <small>Photo editing &amp; compositing</small></h2>
      <hr class="w3-opacity">
      <div class="grid">
        <div class="col">
          <figure class="card">
            <span class="media"><video src="./Photoshop Media/self_portrait-web.mp4" aria-label="Animated self-portrait" autoplay loop muted playsinline></video></span>
            <figcaption><b>Animated Self-Portrait</b><span class="tag">Photoshop</span></figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="card">
            <div class="ba" id="ba" style="--pos:50%">
              <img src="./Photoshop Media/after1.jpg" alt="Edited photo (after)">
              <div class="before"><img src="./Photoshop Media/before1.jpg" alt="Original photo (before)"></div>
              <div class="handle" aria-hidden="true"></div>
              <span class="lbl l">BEFORE</span><span class="lbl r">AFTER</span>
            </div>
            <figcaption><b>Color Grade: Before &amp; After</b><span class="tag">Drag to compare</span></figcaption>
          </figure>
          <figure class="card">
            <span class="media"><img src="./Photoshop Media/sunny day.jpeg" alt="Sunny day landscape under autumn trees" loading="lazy"></span>
            <figcaption><b>Sunny Day</b><span class="tag">Photoshop</span></figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Artwork viewer">
    <button type="button" aria-label="Close">&times;</button>
  </div>

  <!-- FOOTER SECTION -->
  <div id="footer"> </div>

  <!-- SCRIPTS -->
  <script>
    $(function () {
      var root = "../";
      $("#nav_bar").load(root + "nav_bar.html", function () {
        $("#nav_bar a").attr("href", function (i, h) { return root + h.replace(/^\.\//, ""); });
      });
      $("#footer").load(root + "footer_light.html");
    });

    // Before / after slider
    (function () {
      var ba = document.getElementById("ba"), dragging = false;
      function set(x) {
        var r = ba.getBoundingClientRect();
        var p = Math.max(0, Math.min(100, (x - r.left) / r.width * 100));
        ba.style.setProperty("--pos", p + "%");
      }
      ba.addEventListener("pointerdown", function (e) { dragging = true; ba.setPointerCapture(e.pointerId); set(e.clientX); });
      ba.addEventListener("pointermove", function (e) { if (dragging) set(e.clientX); });
      ba.addEventListener("pointerup", function () { dragging = false; });
      ba.addEventListener("pointercancel", function () { dragging = false; });
    })();

    // Click any artwork to view it large
    (function () {
      var box = document.getElementById("lightbox"), close = box.querySelector("button");
      function shut() { box.classList.remove("open"); var m = box.querySelector("img,video"); if (m) m.remove(); }
      document.querySelectorAll(".card .media").forEach(function (m) {
        m.addEventListener("click", function () {
          var src = m.querySelector("img,video"), el = src.cloneNode(true);
          if (el.tagName === "VIDEO") { el.controls = true; el.muted = true; el.play && el.play(); }
          box.appendChild(el); box.classList.add("open");
        });
      });
      close.addEventListener("click", shut);
      box.addEventListener("click", function (e) { if (e.target === box) shut(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") shut(); });
    })();
  </script>
</body>
</html>
